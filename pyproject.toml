[project]
name = "chunkyard"
version = "0.1.0"
description = "See how chunking strategy changes what a RAG system retrieves."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
